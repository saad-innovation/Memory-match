<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Memory Match - Interactive JavaScript Game</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Play Neon Memory Match! An interactive, highly animated 3D memory card game built with HTML, CSS, and Vanilla JavaScript. Test your memory and set high scores.">
    <meta name="keywords" content="memory match, memory game, javascript game, neon game, frontend project, html css js game, interactive web game">
    <meta name="author" content="Muhammad Saad Ali">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://saad-innovation.github.io/Memory-match/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://saad-innovation.github.io/Memory-match/">
    <meta property="og:title" content="Neon Memory Match - Interactive JavaScript Game">
    <meta property="og:description" content="Test your memory with this stunning neon-themed card matching game. Features 3D animations and local storage score tracking.">
    <meta property="og:image" content="https://saad-innovation.github.io/Memory-match/screenshot.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://saad-innovation.github.io/Memory-match/">
    <meta property="twitter:title" content="Neon Memory Match - Interactive JavaScript Game">
    <meta property="twitter:description" content="Test your memory with this stunning neon-themed card matching game. Features 3D animations and local storage score tracking.">
    <meta property="twitter:image" content="https://saad-innovation.github.io/Memory-match/screenshot.png">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="confetti"></canvas>

    <header>
        <h1>Neon Match</h1>
        <div class="hud">
            <div class="stat">
                <span class="stat-label">Moves</span>
                <span class="stat-value" id="moves-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Best</span>
                <span class="stat-value" id="best-score">--</span>
            </div>
        </div>
    </header>

    <div class="game-board" id="board">
        <!-- Cards injected via JavaScript -->
    </div>

    <div class="controls">
        <button class="btn" id="restart-btn">Restart Game</button>
    </div>

    <div class="modal-overlay" id="victory-modal">
        <div class="modal-box">
            <h2>System Clear!</h2>
            <p>Completed in <span class="highlight" id="final-moves">0</span> moves.</p>
            <div class="record-banner" id="record-banner">🏆 NEW HIGH SCORE! 🏆</div>
            <button class="btn" id="play-again-btn" style="border-color: var(--neon-pink); color: var(--neon-pink);">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
